# COI API in Docker. Settings and secrets come from .env (copy .env.example) at runtime only; EDENAI_API_KEY is the
# only one that must be set (README, "Uruchomienie aplikacji"):
#   docker compose up -d --build
services:
  api:
    build:
      context: .
      args:
        LIBREOFFICE: ${LIBREOFFICE:-1}  # LibreOffice in the image: office files become page images
    image: coi-formularze:0.1.0
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    # Writes only to temporary space: read-only root, /tmp in memory (temp files, history).
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
