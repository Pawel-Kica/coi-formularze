[project]
name = "coi-formularze"
version = "0.2.0"
description = "Paper form (PDF/DOC/DOCX/ODS/XLSX/XLS/JPG/PNG) -> COI e-service JSON, read and planned by open-weights models on Eden AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jsonata-python>=0.7.2",
    "jsonschema>=4.26.0",
    "olefile>=0.47",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.34",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Fast by default (~5 s): OCR tests (Tesseract, ~60 s) are marked slow. All: `uv run pytest -m ""`.
addopts = "-m 'not slow'"
markers = ["slow: OCR on scans and images (Tesseract), run with -m slow or -m \"\""]
