<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formularz na e-usługę COI</title>
<style>
  :root { --fg: #1b1b1f; --muted: #5d5d66; --bg: #f6f6f8; --card: #fff; --line: #d9d9e0; --accent: #1f3b73; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #ececf1; --muted: #a0a0ab; --bg: #16161a; --card: #202026; --line: #34343c; --accent: #8fb0ff; }
  }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  form, pre { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  form { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button, a.btn { background: var(--accent); color: var(--bg); border: 0; border-radius: 6px; padding: 8px 16px;
    font: inherit; cursor: pointer; text-decoration: none; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { color: var(--muted); }
  pre { overflow: auto; max-height: 70vh; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Formularz na e-usługę COI</h1>
  <p>Wgraj pusty formularz (PDF, DOC, DOCX, ODS, XLS, XLSX, JPG, PNG), dostaniesz JSON e-usługi COI gotowy do importu.
    API: <a href="/docs">/docs</a>.</p>
  <form id="upload">
    <input type="file" name="file" required
      accept=".pdf,.doc,.docx,.ods,.xls,.xlsx,.jpg,.jpeg,.jpe,.png">
    <button>Konwertuj</button>
    <a class="btn" id="download" hidden download>Pobierz JSON</a>
    <span id="status"></span>
  </form>
  <pre id="out" hidden></pre>
</main>
<script>
const form = document.getElementById("upload"), out = document.getElementById("out"),
  status = document.getElementById("status"), download = document.getElementById("download");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = form.querySelector("button"), file = form.file.files[0], started = Date.now();
  button.disabled = true; download.hidden = true; out.hidden = true;
  const tick = setInterval(() => status.textContent = `Przetwarzanie... ${Math.round((Date.now() - started) / 1000)} s`, 1000);
  try {
    const res = await fetch("/api/forms/convert", { method: "POST", body: new FormData(form) });
    const body = await res.json();
    if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
    const text = JSON.stringify(body, null, 2);
    out.textContent = text; out.hidden = false;
    download.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    download.download = file.name.replace(/\.[^.]+$/, "") + ".json"; download.hidden = false;
    status.textContent = `Gotowe w ${Math.round((Date.now() - started) / 1000)} s`;
  } catch (err) {
    status.textContent = `Błąd: ${err.message}`;
  } finally {
    clearInterval(tick); button.disabled = false;
  }
});
</script>
</body>
</html>
