<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Słowniki | generator e-usług COI</title>
<!-- The dictionary catalog page ("/slowniki", link "Słowniki" in the header of "/"): the COI dictionaries read-only and
     ours (backend/app/api/dictionaries.py, /api/dictionaries) with their values: "+ Dodaj wartość", "×", "Usuń słownik". A form field
     names a dictionary by its code only, so a value added here shows in the form preview without touching the form.
     "?kod=<code>" opens that dictionary. No build step, same look as the upload page. -->
<style>
  :root {
    --navy: #2b2f6b; --navy-dark: #1c1f4d; --text: #1d1c26; --muted: #5a6470;
    --line: #ddd7cc; --bg: #f1ede6; --ok: #1a7f37; --err: #b3261e; --warn: #9a4d00;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); line-height: 1.5; min-height: 100vh; }
  header { background: var(--navy-dark); color: #fff; }
  .bar { padding: 10px 16px; display: flex; gap: 16px; align-items: center; }
  .bar h1 { font-size: 1.15rem; margin: 0; flex: 1; }
  .bar h1 a { color: inherit; text-decoration: none; }
  .bar small { display: block; font-weight: 400; opacity: .85; }
  .bar a.nav { color: #fff; font-weight: 600; text-decoration: none; padding: 4px 10px; border-radius: 4px; }
  .bar a.nav:hover, .bar a.nav[aria-current] { background: rgba(255,255,255,.15); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 4px; }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  h3:first-child { margin-top: 0; }
  button { font: inherit; cursor: pointer; border-radius: 4px; padding: 6px 12px; border: 1px solid var(--navy); background: #fff; color: var(--navy); }
  button.primary { background: var(--navy); color: #fff; }
  button:hover { background: var(--navy-dark); border-color: var(--navy-dark); color: #fff; }
  button.danger { border-color: var(--err); color: var(--err); }
  button.danger:hover { background: var(--err); color: #fff; }
  button:disabled { opacity: .45; pointer-events: none; }
  :focus-visible { outline: 3px solid #c2662d; outline-offset: 2px; }
  input[type=text] { font: inherit; padding: 6px 10px; border: 1px solid #8a94a0; border-radius: 4px; width: 100%; }
  .muted { color: var(--muted); font-size: .9rem; }
  .error { color: var(--err); }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { margin-bottom: 4px; }
  ul.list button { width: 100%; text-align: left; border-color: var(--line); color: var(--text); padding: 6px 10px; display: flex; gap: 8px; justify-content: space-between; }
  ul.list button:hover { background: #ecebf6; color: var(--text); border-color: var(--line); }
  ul.list button[aria-pressed=true] { border-color: var(--navy); box-shadow: inset 4px 0 0 var(--navy); background: #f6f5fb; }
  ul.list .count { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .chip { font-size: .75rem; padding: 1px 8px; border-radius: 999px; background: #ecebf6; color: var(--navy-dark); white-space: nowrap; }
  .chip.fill { background: #fff3e0; color: var(--warn); }
  .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .head h2 { margin-right: auto; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 12px 0 16px; font-size: .95rem; }
  dt { color: var(--muted); }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  code { font-size: .9rem; background: #f8f6f2; padding: 1px 5px; border-radius: 3px; }
  ol.values { margin: 0 0 12px; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 6px; }
  ol.values li { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); }
  ol.values li:last-child { border-bottom: 0; }
  ol.values li span { flex: 1; }
  ol.values li code { color: var(--muted); font-size: .8rem; }
  ol.values li button { padding: 0 9px; border-color: transparent; color: var(--muted); }
  ol.values li button:hover { background: #fbeaea; border-color: var(--err); color: var(--err); }
  ol.values .empty { color: var(--warn); padding: 12px; }
  form.add { display: flex; gap: 8px; }
  .foot { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><a href="/">Cyfryzacja formularzy</a><small>Katalog słowników dla e-usług COI</small></h1>
    <a href="/" class="nav" id="back">Formularze</a>
    <a href="/slowniki" class="nav" aria-current="page">Słowniki</a>
  </div>
</header>
<main>
  <nav class="card" aria-label="Słowniki">
    <h3>Słowniki urzędu</h3>
    <ul class="list" id="ours"></ul>
    <p class="muted" id="ours-empty">Jeszcze żadnego. Dodasz je w zakładce „Słowniki” przy formularzu.</p>
    <h3>Słowniki COI</h3>
    <ul class="list" id="coi"></ul>
  </nav>
  <section class="card" id="detail" aria-live="polite">
    <p class="muted">Wybierz słownik z listy.</p>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const state = { token: sessionStorage.getItem("token") || "open", list: [], code: new URLSearchParams(location.search).get("kod") };

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function button(text, className, onclick) {
  const b = el("button", className, text);
  b.type = "button";
  b.addEventListener("click", onclick);
  return b;
}

async function api(url, method = "GET", body) {
  const response = await fetch(url, { method, headers: { Authorization: `Bearer ${state.token}`, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body && JSON.stringify(body) });
  if (response.status === 401) throw new Error("Zaloguj się na stronie „Formularze”, potem wróć tutaj.");
  if (response.status === 204) return null;
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : `Błąd ${response.status}`);
  return data;
}

async function load() {
  try {
    state.list = await api("/api/dictionaries");
  } catch (error) {
    return $("#detail").replaceChildren(el("p", "error", error.message));
  }
  if (!state.list.some((d) => d.code === state.code)) state.code = state.list.find((d) => !d.builtin)?.code ?? null;
  render();
}

function render() {
  const item = (d) => {
    const li = el("li");
    const b = button("", "", () => { state.code = d.code; history.replaceState(null, "", `?kod=${encodeURIComponent(d.code)}`); render(); });
    b.setAttribute("aria-pressed", String(d.code === state.code));
    b.append(el("span", "", d.name), el("span", "count", d.builtin ? "COI" : String(d.items.length)));
    li.append(b);
    return li;
  };
  const ours = state.list.filter((d) => !d.builtin);
  $("#ours").replaceChildren(...ours.map(item));
  $("#ours-empty").hidden = ours.length > 0;
  $("#coi").replaceChildren(...state.list.filter((d) => d.builtin).map(item));
  renderDetail(state.list.find((d) => d.code === state.code));
}

function renderDetail(d) {
  const box = $("#detail");
  if (!d) return box.replaceChildren(el("p", "muted", "Wybierz słownik z listy."));
  const head = el("div", "head");
  head.append(el("h2", "", d.name), d.builtin ? el("span", "chip", "Słownik COI, tylko do odczytu")
    : el("span", d.items.length ? "chip" : "chip fill", d.items.length ? `${d.items.length} wartości` : "bez wartości"));
  const dl = el("dl");
  const row = (term, value) => dl.append(el("dt", "", term), value);
  const code = el("dd");
  code.append(el("code", "", d.code), el("span", "muted", " w JSON-ie e-usługi jako dictionaryName"));
  row("Kod", code);
  if (d.builtin) {
    row("Wartości", el("dd", "", d.note));
    return box.replaceChildren(head, dl);
  }
  row("Skąd", el("dd", "", d.sources.length ? d.sources.map((s) => `${s.file}, pole „${s.field}”`).join("; ") : "dodany ręcznie"));

  const values = el("ol", "values");
  values.setAttribute("aria-label", "Wartości słownika");
  if (!d.items.length) values.append(el("li", "empty", "Słownik nie ma jeszcze wartości. Dopisz pierwszą poniżej."));
  for (const [i, v] of d.items.entries()) {
    const li = el("li");
    const del = button("×", "", () => save(d, d.items.filter((_, k) => k !== i), null));
    del.title = del.ariaLabel = `Usuń wartość „${v.nazwa}”`;
    const name = el("span", "", v.nazwa);
    name.title = `Kod: ${v.kod}`;
    li.append(name, del);
    values.append(li);
  }
  const form = el("form", "add");
  const input = el("input");
  Object.assign(input, { type: "text", placeholder: "Nowa wartość, np. Tosa inu", ariaLabel: "Nowa wartość" });
  const add = el("button", "primary", "+ Dodaj wartość");
  add.type = "submit";
  const msg = el("p", "error");
  msg.setAttribute("role", "alert");
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const name = input.value.trim();
    if (!name) return input.focus();
    save(d, null, "add", name);
  });
  form.append(input, add);
  const foot = el("div", "foot");
  foot.append(el("span", "muted", "Formularze widzą zmiany od razu, bez przerabiania pliku."),
    button("Usuń słownik", "danger", () => remove(d)));
  msg.textContent = state.flash || "";
  state.flash = null;
  box.replaceChildren(head, dl, el("h3", "", "Wartości"), values, form, msg, foot);
  if (state.focus === "add") input.focus();
  state.focus = null;
}

// "+ Dodaj wartość" merges one value on the server (POST .../items: nothing else is overwritten, a duplicate is skipped);
// "×" sends the list without that value (PUT).
async function save(d, items, focus, added) {
  try {
    const next = added ? await api(`/api/dictionaries/${encodeURIComponent(d.code)}/items`, "POST", { items: [added] })
      : await api(`/api/dictionaries/${encodeURIComponent(d.code)}`, "PUT", { items });
    if (added && next.items.length === d.items.length) state.flash = "Taka wartość już jest.";
    if (focus === "add" && next.items.length === d.items.length) return alert("Taka wartość już jest.");
    state.list = state.list.map((x) => (x.code === d.code ? next : x));
    localStorage.setItem("coi-catalog", String(Date.now()));  // open forms (other tabs) read the catalog again
    state.focus = focus;
    render();
  } catch (error) {
    alert(`Nie udało się zapisać: ${error.message}`);
  }
}

async function remove(d) {
  if (!confirm(`Usunąć słownik „${d.name}”? Pola, które go używają, pokażą w podglądzie „nieznany słownik”.`)) return;
  try {
    await api(`/api/dictionaries/${encodeURIComponent(d.code)}`, "DELETE");
    state.code = null;
    localStorage.setItem("coi-catalog", String(Date.now()));
    load();
  } catch (error) {
    alert(`Nie udało się usunąć: ${error.message}`);
  }
}

// Opened from the preview ("uzupełnij w katalogu", a new tab): "Formularze" goes back to that tab, where the form
// stays as it was and reads the new values on focus.
$("#back").addEventListener("click", (event) => {
  if (window.opener && !window.opener.closed) {
    event.preventDefault();
    window.opener.focus();
    window.close();
    setTimeout(() => (location.href = "/"), 200);  // the browser refused to close this tab
  }
});
load();
// another tab changed the catalog ("Dodaj" next to a proposal): read it again, so a save never writes stale values
addEventListener("focus", load);
addEventListener("storage", (event) => { if (event.key === "coi-catalog") load(); });
</script>
</body>
</html>
