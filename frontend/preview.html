             status.textContent = showMissing(validateAll()) ? "" : "To jest podgląd: wniosek jest kompletny, ale nie został wysłany.";
           }}, "Wyślij wniosek")
         : h("button", {type: "button", class: "btn", onclick: () => go(pageIdx + 1)}, "Dalej")),
    status);
  renderStepper();
  refreshStates(true);
}

// Text of an answer for the summary ("" = skip).
function fmtVal(f, v) {
  if (f.type === "CONSENT_SECTION") { const n = (v || []).filter(Boolean).length; return n ? `Zaznaczono ${n} z ${(v || []).length}` : ""; }
  if (typeof v === "boolean") return v ? "Tak" : "";
  if (Array.isArray(v)) return v.join(", ");
  return v == null ? "" : String(v).trim();
}

// "Podsumowanie" card: visible answered fields per MAIN page and section.
function renderSummary() {
  const card = h("section", {class: "card summary", "aria-labelledby": "sumH"}, h("h3", {id: "sumH"}, "Podsumowanie"));
  for (const tab of pages) {
    if (tab.type === "FINISH") continue;
    const blocks = [];
    for (const q of tab.questions) {
      const sec = q.field, rs = sec.type === "REPEATING_SECTION";
      if (!(sec.type === "SECTION" || rs) || !stateOf(sec, null).show) continue;
      const data = answers[tab.title][sec.techName];
      (rs ? data : [data]).forEach((r, i) => {
        const items = [];
        for (const c of sortCells(sec.repeatingSectionGrid)) {
          const f = c.field;
          if (STATIC_TYPES.includes(f.type) || !stateOf(f, rs ? i : null).show) continue;
          const txt = fmtVal(f, r[f.techName]);
          if (txt) items.push(h("dt", {}, labelOf(f)), h("dd", {}, txt));
        }
        if (items.length) blocks.push(h("h5", {}, (sec.title || sec.techName) + (rs ? `, pozycja ${i + 1}` : "")), h("dl", {}, items));
      });
    }
    if (blocks.length) card.append(h("h4", {}, tab.title), ...blocks);
  }
  if (card.children.length === 1) card.append(h("p", {}, "Brak wypełnionych pól."));
  return card;
}

/* ---------- validation ---------- */
const digits = s => s.replace(/[\s-]/g, "");
const weighted = (d, w) => w.reduce((sum, x, k) => sum + x * +d[k], 0);
function validPesel(s) {
  if (!/^\d{11}$/.test(s)) return false;
  return (10 - weighted(s, [1,3,7,9,1,3,7,9,1,3]) % 10) % 10 === +s[10];
}
function validNip(s) {
  const d = digits(s);
  if (!/^\d{10}$/.test(d)) return false;
  const c = weighted(d, [6,5,7,2,3,4,5,6,7]) % 11;
  return c !== 10 && c === +d[9];
}
function validRegon(s) {
  const d = digits(s);
  if (/^\d{9}$/.test(d)) return weighted(d, [8,9,2,3,4,5,6,7]) % 11 % 10 === +d[8];
  if (/^\d{14}$/.test(d)) return weighted(d, [2,4,8,5,0,9,7,3,6,1,2,4,8]) % 11 % 10 === +d[13];
  return false;
}
const FORMATS = {
  PESEL: [validPesel, "Wpisz poprawny numer PESEL (11 cyfr)."],
  NIP: [validNip, "Wpisz poprawny NIP (10 cyfr)."],
  REGON: [validRegon, "Wpisz poprawny REGON (9 lub 14 cyfr)."],
  ZIP_CODE: [s => /^\d{2}-\d{3}$/.test(s), "Wpisz kod pocztowy w formacie 00-000."],
  EMAIL: [s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s), "Wpisz poprawny adres e-mail."],
  EPUAP: [s => /^\/[^\/\s]+\/[^\/\s]+$/.test(s), "Wpisz adres skrytki ePUAP w formacie /nazwa/skrytka."],
  ADE: [s => /^AE:PL-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{2}$/i.test(s.replace(/\s/g, "")), "Wpisz adres do e-Doręczeń w formacie AE:PL-00000-00000-AAAAA-00."],
  SERIAL_NUMBER_ID_CARD: [s => /^[A-Z]{3}\d{6}$/i.test(s.replace(/\s/g, "")), "Wpisz serię i numer dowodu osobistego (3 litery i 6 cyfr)."],
};

const isEmpty = v => v == null || v === false || (Array.isArray(v) ? v.length === 0 : String(v).trim() === "");

// Error message for one field entry, or null when valid.
function checkField({field: f, store}) {
  const v = store[f.techName], vs = validators(f);
  if (STATIC_TYPES.includes(f.type)) return null;
  if (f.type === "CONSENT_SECTION")
    return consentsOf(f).some((c, k) => consentRequired(f, c) && !(v || [])[k]) ? "Zaznacz wymagane zgody." : null;
  if (isEmpty(v)) return vs.includes("REQUIRED") ? "Pole jest wymagane." : null;
  if (typeof v !== "string") return null;
  const s = v.trim();
  if (f.type === "NUMBER" && !/^-?\d+([.,]\d+)?$/.test(s.replace(/\s/g, ""))) return "Wpisz liczbę.";
  for (const name of vs) if (FORMATS[name] && !FORMATS[name][0](s)) return FORMATS[name][1];
  return null;
}

// Shows (or with null clears) the error line of one field.
function showErr(wrap, msg) {
  const err = $(".err", wrap);
  err.hidden = !msg;
  err.replaceChildren(...(msg ? [h("span", {"aria-hidden": "true"}, "⚠ "), msg] : []));
  for (const c of wrap._entry.controls) msg ? c.setAttribute("aria-invalid", "true") : c.removeAttribute("aria-invalid");
}
const clearErr = wrap => { if (!$(".err", wrap).hidden) showErr(wrap, null); };

function focusField(wrap) {
  const c = wrap._entry.controls.find(x => !x.disabled) || $("h2", $("#page"));
  c.scrollIntoView({block: "center"});
  c.focus({preventScroll: true});
}

// What a citizen would still have to fix before sending, over the visible fields of every page:
// [{page, field, row, msg}]. Reads the config and the answers, not the screen, so it covers pages not shown.
function validateAll() {
  const out = [];
  pages.forEach((tab, page) => {
    for (const q of tab.questions) {
      const sec = q.field, rs = sec.type === "REPEATING_SECTION";
      if (!stateOf(sec, null).show) continue;
      if (sec.type !== "SECTION" && !rs) { // a loose field
        const msg = checkField({field: sec, store: answers[tab.title].__root});
        if (msg) out.push({page, field: sec, row: null, msg});
        continue;
      }
      const data = answers[tab.title][sec.techName];
      (rs ? data : [data]).forEach((store, i) => {
        for (const c of sortCells(sec.repeatingSectionGrid)) {
          if (!stateOf(c.field, rs ? i : null).show) continue;
          const msg = checkField({field: c.field, store});
          if (msg) out.push({page, field: c.field, row: rs ? i : null, msg});
        }
      });
    }
  });
  return out;
}

// Lists those problems above the page, each a link to its field; false when there are none.
function showMissing(errs) {
  const box = $("#errsum");
  box.className = ""; box.removeAttribute("role"); box.replaceChildren();
  if (!errs.length) return false;
  const open = e => {
    if (e.page !== pageIdx) go(e.page, false);
    const cells = [...$("#page").querySelectorAll(`.cell[data-fid="${CSS.escape(e.field.id)}"]`)];
    const wrap = cells[e.row || 0] || cells[0];
    if (wrap) { showErr(wrap, e.msg); focusField(wrap); }
  };
  box.className = "errsum";
  box.setAttribute("role", "status");
  box.append(h("p", {}, h("strong", {}, "To jest podgląd: wniosek nie został wysłany. "),
      `Obywatel musiałby jeszcze uzupełnić ${errs.length} ${plural(errs.length, ["pole", "pola", "pól"])}.`),
    h("details", {}, h("summary", {}, "Pokaż te pola"),
      h("ul", {}, errs.map(e => h("li", {}, h("a", {href: "#", onclick: ev => { ev.preventDefault(); open(e); }},
        `${pages[e.page].title} › ${labelOf(e.field)}${e.row != null ? ` (pozycja ${e.row + 1})` : ""}: ${e.msg}`))))));
  box.scrollIntoView({block: "center"});
  return true;
}

/* ---------- tool bar, drag and drop, startup ---------- */
const readFile = file => file && file.text().then(t => loadText(t), e => showLoadError("Nie udało się odczytać pliku: " + e.message));
const fileInput = $("#fileInput");
$("#tbOpen").addEventListener("click", () => fileInput.click());
$("#emptyOpen").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { readFile(fileInput.files[0]); fileInput.value = ""; });
$("#emptyLoad").addEventListener("click", () => loadText($("#emptyText").value));
$("#tbPaste").addEventListener("click", () => { $("#pasteText").value = ""; $("#pasteDlg").showModal(); });
$("#pasteDlg").addEventListener("close", () => { if ($("#pasteDlg").returnValue === "ok") loadText($("#pasteText").value); });
$("#techToggle").addEventListener("change", applyModes);
$("#notesToggle").addEventListener("change", applyModes);
$("#condsToggle").addEventListener("change", applyModes);
$("#tbReset").addEventListener("click", () => { if (!cfg) return; resetAnswers(); go(0); });
TITLE_FIX.addEventListener("click", () => edOpen("__title"));
window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dragging"); });
window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
window.addEventListener("drop", e => {
  e.preventDefault();
  document.body.classList.remove("dragging");
  // embedded: a file dropped here is a form for the upload page, not a JSON for this preview
  if (EMBED) parent.postMessage({type: "coi-drop", files: [...e.dataTransfer.files]}, location.origin);
  else readFile(e.dataTransfer.files[0]);
});

renderIssues();
// The catalog: now, when this tab comes back, when the "Słowniki" page or "Dodaj" (any tab) saved a change, with every document.
loadCatalog();
addEventListener("storage", e => { if (e.key === "coi-catalog") loadCatalog(); });  // the "Słowniki" page saved a change
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadCatalog(); });
addEventListener("message", e => { if (e.origin === location.origin && e.data?.type === "coi-preview") loadCatalog(); });
// Embed mode: the same-origin parent (upload page) posts {type: "coi-preview", json, evidence, key, doc} for the
// selected file. Each message replaces the whole form, and nothing is saved, so the standalone preview keeps its own
// JSON. The same `key` again (the same file sent once more) keeps the open step, the place on screen and the answers.
// editor.js then starts the "Edycja" sidebar for this document. {type: "coi-sources", doc} follows with the "Źródło" data.
applyModes();
if (EMBED) {
  document.body.classList.add("embed");
  $("#empty").hidden = true;
  let shownKey;
  window.addEventListener("message", e => {
    if (e.origin !== location.origin) return;
    if (e.data?.type === "coi-sources") {  // "Źródło" data for the document on screen: open crops are redrawn
      if (e.data.doc !== docN) return;
      paper = e.data;
      const byId = new Map();
      eachField(f => byId.set(f.id, f));
      for (const box of document.querySelectorAll(".srcbox:not([hidden])")) if (byId.has(box.dataset.src)) fillSrc(box, byId.get(box.dataset.src));
      return;
    }
    if (e.data?.type !== "coi-preview") return;
    const same = cfg && e.data.key !== undefined && e.data.key === shownKey;
    if (!same) { paper = null; openSrc.clear(); foldedRows.clear(); }
    docKey = e.data.key; docN = e.data.doc;
    const step = same ? pageIdx : 0, kept = same ? answers : null;
    // the element at the top of the screen keeps its place
    const top = same && [...$("#page").querySelectorAll("[data-fid]")].find(x => x.getClientRects().length && x.getBoundingClientRect().top >= 0);
    const anchor = top && scrollY > 0 ? {id: top.dataset.fid, at: top.getBoundingClientRect().top} : null;
    shownKey = e.data.key;
    $("#app").hidden = true; // a JSON that fails to load must not leave the previous form on screen
    loadText(e.data.json, false, e.data.evidence);
    if ($("#app").hidden) return;
    if (kept) keepAnswers(kept);
    if (same) go(step, false);
    setTimeout(() => {  // after editor.js has drawn its marks (its listener runs next)
      const el = anchor && $(`#page [data-fid="${CSS.escape(anchor.id)}"]`);
      if (el) window.scrollBy(0, el.getBoundingClientRect().top - anchor.at);
    });
  });
} else {
  const saved = (() => { try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; } })();
  if (saved) loadText(saved, false);
}
</script>
<!-- Edit mode (the click editor on the upload page); inactive unless the parent sends {edit: true}. -->
<script src="/editor.js"></script>
